<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - EventSphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">EventSphere</div>

        <a href="participant.html" class="home-link">
            Back to Events
        </a>
    </header>

    <main class="event-details-page">

        <section class="event-details-card">

            <p class="welcome-text">EVENT DETAILS</p>

            <h1 id="eventName">Loading...</h1>

            <div class="event-information">

                <p>
                    <strong>Description:</strong>
                    <span id="eventDescription">Loading...</span>
                </p>

                <p>
                    <strong>Date:</strong>
                    <span id="eventDate">Loading...</span>
                </p>

                <p>
                    <strong>Fee:</strong>
                    ₹<span id="eventFee">Loading...</span>
                </p>

                <p>
                    <strong>Available Seats:</strong>
                    <span id="eventSeats">Loading...</span>
                </p>

            </div>

            <a href="registration.html" id="registerLink" class="event-button">
                Register for Event
            </a>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
