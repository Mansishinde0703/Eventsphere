<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Dashboard - EventSphere</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">EventSphere</div>

        <a href="index.html" class="home-link">
            Logout
        </a>
    </header>

    <main class="dashboard-page">

        <section class="dashboard-heading">

            <p class="welcome-text">ORGANIZER</p>

            <h1>Event Dashboard</h1>

            <p>
                Create and manage your events from one place.
            </p>

        </section>

        <section class="dashboard-actions">

            <a href="create-event.html" class="dashboard-card">
                <h2>Create Event</h2>
                <p>Add a new event to EventSphere.</p>
                <span>Create →</span>
            </a>

            <div class="dashboard-card">
                <h2>My Events</h2>
                <p>View and manage your created events.</p>
                <span>View →</span>
            </div>

        </section>

    </main>

</body>
</html>
